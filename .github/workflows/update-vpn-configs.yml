name: Update VPN Configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # каждый час в 00 минут

jobs:
  update-configs:
    name: Обновление конфигурации
    runs-on: ubuntu-latest

    steps:
      # ✅ Вариант 1: БЕЗ токена (работает для публичных репозиториев)
      - name: 📥 Копируем репозиторий
        uses: actions/checkout@v4

      # ✅ Если нужно с токеном — раскомментируй этот блок и добавь секрет
      # - name: 📥 Копируем репозиторий (с токеном)
      #   uses: actions/checkout@v4
      #   with:
      #     token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Устанавливаем Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 📦 Создаём окружение
        run: |
          python -m venv venv --copies
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install httpx requests urllib3 python-dotenv

      - name: ⚙️ Запускаем main.py
        run: ./venv/bin/python source/main.py

      - name: 🔧 Настраиваем Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "actions@github.com"

      - name: 💾 Сохраняем изменения
        run: |
          git add .
          git diff --cached --quiet || git commit -m "🔄 Обновлено: $(date +'%d.%m.%Y %H:%M')"
          git pull --rebase origin main || true
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # ✅ Используем встроенный токен, он уже есть!
